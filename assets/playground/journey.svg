    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1cd95"/><stop offset="1" stop-color="#e3b073"/></linearGradient>
  </defs>
  <rect width="1040" height="400" fill="url(#sky)"/>
