    <g transform="translate(834 170)"><circle r="10" fill="#fff"/><circle r="6" fill="#ff6a3d"/><rect x="-28" y="-46" width="56" height="26" rx="13" fill="#fff"/><text y="-28" fill="#18181a">UAE</text></g>
